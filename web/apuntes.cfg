% Configuración de make4ht para la versión HTML de los apuntes (solo se usa en web/construir.sh).
% Se genera un único main.html (lo parte web/partir_html.py por subsecciones);
% las fórmulas se dibujan con MathJax y las figuras TikZ/pgfplots se convierten a SVG.
\Preamble{xhtml,mathjax,svg}

% Sin las opciones enhanced/breakable de las cajas: con ellas, make4ht dibuja algunas cajas enteras
% como imagen SVG. Los colores los pone estilo.css.
\tcbset{futuristicbase/.style={fonttitle=\bfseries}}

% Con make4ht las etiquetas de las cajas no llegan al .aux, así que \cref saldría "??". En HTML,
% \cref{a,b} solo deja la marca [[REF:a,b]]; web/mapa/generar.py la cambia luego por enlaces
% ("Proposición 1.7") porque sabe el número y la página de cada resultado.
\AddToHook{begindocument/end}{%
  \RenewDocumentCommand\cref{m}{\HCode{[[REFM:#1]]}}%
  \RenewDocumentCommand\Cref{m}{\HCode{[[REFM:#1]]}}}

% MathJax no conoce las macros de babel en español (\sen en el PDF), así que se definen aquí.
\Configure{MathJaxConfig}{{ tex: { tags: "ams", macros: { sen: "\string\\operatorname{sen}", tg: "\string\\operatorname{tg}", arcsen: "\string\\operatorname{arcsen}", arctg: "\string\\operatorname{arctg}" } } }}

\Configure{AddCss}{estilo.css}
\Configure{@HEAD}{\HCode{<meta name="viewport" content="width=device-width, initial-scale=1" />\Hnewline}}
\Configure{@BODY}{\HCode{<nav class="barra"><a href="index.html">Apuntes</a><a href="../mapa/">Mapa de resultados</a><a href="https://github.com/jmnu4245/Analisis-de-fourier/releases/latest">PDF</a><a href="https://github.com/jmnu4245/Analisis-de-fourier">GitHub</a></nav>\Hnewline}}

\begin{document}

% babel (español) activa ", < y > como atajos de comillas; romperían las etiquetas HTML de las macros.
\shorthandoff{"<>}

% En HTML no hay portada por sección (con su índice local) ni la línea decorativa bajo cada sección.
\renewcommand{\portadaseccion}[1]{\section{#1}}
\renewcommand{\neonrule}[1]{}
% Icono del entorno ejemplo (fontawesome no se puede usar en HTML).
\renewcommand{\faEdit}{\HCode{&\#x270E;}}

\EndPreamble
